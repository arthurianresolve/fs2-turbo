[package]
name = "fs2-turbo"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Dan Burkert <dan@danburkert.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/arthurianresolve/fs2-turbo"
homepage = "https://github.com/arthurianresolve/fs2-turbo"
documentation = "https://docs.rs/fs2-turbo"
readme = "README.md"
description = "Cross-platform file locks, allocation, duplication and filesystem statistics."
keywords = ["file", "file-system", "lock", "duplicate", "flock"]
categories = ["filesystem"]
exclude = [
    ".cargo/",
    ".github/",
    "artifacts/",
    "compatibility/",
    "CONTEXT.md",
    "deny.toml",
    "support-matrix.json",
    "tools/",
]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lib]
name = "fs2"

[workspace]
members = ["tools/fs2-dev"]
exclude = ["compatibility"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88.0"

[dependencies]
cfg-if = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27"

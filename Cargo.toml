[package]
name = "fs2"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
authors = ["Dan Burkert <dan@danburkert.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/arthurianresolve/fs2-rs"
documentation = "https://docs.rs/fs2"
description = "Cross-platform file locks, allocation, duplication and filesystem statistics."
keywords = ["file", "file-system", "lock", "duplicate", "flock"]
categories = ["filesystem"]
exclude = [
    ".cargo/",
    ".github/",
    "artifacts/",
    "benchmark-report.md",
    "benchmarks/",
    "BENCHMARK_VALIDATION_HISTORICAL.md",
    "compatibility/",
    "CONTEXT.md",
    "deny.toml",
    "support-matrix.json",
    "tools/",
]

[workspace]
members = ["benchmarks", "tools/fs2-dev"]
exclude = ["compatibility", "benchmarks/vendor/page_size"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88.0"

[dependencies]
cfg-if = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27"

[patch.crates-io]
page_size = { path = "benchmarks/vendor/page_size" }


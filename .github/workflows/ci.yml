name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 1 1 * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  support-matrix:
    name: Validate support matrix
    outputs:
      rust_version: ${{ steps.matrix.outputs.rust_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88.0"
      - id: matrix
        run: cargo xtask matrix --github-output "$GITHUB_OUTPUT"
      - name: Test coverage evidence integrity and merge policy
        run: node --test .github/scripts/coverage-audit.test.cjs
      - run: cargo test --package fs2-dev --locked

  check:
    needs: support-matrix
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, toolchain: stable }
          - { os: macos-15-intel, target: x86_64-apple-darwin, toolchain: "1.88.0" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, toolchain: stable }
          - { os: macos-latest, target: aarch64-apple-darwin, toolchain: "1.88.0" }
          - { os: macos-latest, target: aarch64-apple-darwin, toolchain: stable }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, toolchain: "1.88.0" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, toolchain: stable }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --package fs2-turbo --all-targets --target "${{ matrix.target }}" --locked -- -D warnings
      - run: cargo test --package fs2-turbo --target "${{ matrix.target }}" --locked
      - run: cargo test --package fs2-dev --target "${{ matrix.target }}" --locked
      - if: matrix.toolchain == needs.support-matrix.outputs.rust_version
        run: cargo xtask compatibility

  cross_check:
    needs: support-matrix
    name: ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: powerpc64-unknown-linux-gnu, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: aarch64-linux-android, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: i686-linux-android, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: aarch64-pc-windows-msvc, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: x86_64-unknown-freebsd, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: x86_64-unknown-netbsd, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: x86_64-unknown-illumos, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: x86_64-unknown-redox, toolchain: "1.88.0" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - run: cargo check --package fs2-turbo --tests --target "${{ matrix.target }}" --locked

  mingw:
    needs: support-matrix
    name: ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: i686-pc-windows-gnu, toolchain: "1.88.0" }
          - { os: ubuntu-latest, target: x86_64-pc-windows-gnu, toolchain: "1.88.0" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MinGW import-library tools
        run: |
          ubuntu_sources=/etc/apt/sources.list
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get \
            -o Dir::Etc::sourcelist="$ubuntu_sources" \
            -o Dir::Etc::sourceparts=- \
            update
          sudo apt-get \
            -o Dir::Etc::sourcelist="$ubuntu_sources" \
            -o Dir::Etc::sourceparts=- \
            install -y --no-install-recommends binutils-mingw-w64
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - run: cargo build --package fs2-turbo --lib --target "${{ matrix.target }}" --locked

  uclibc:
    needs: support-matrix
    name: ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: armv7-unknown-linux-uclibceabihf, toolchain: nightly }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rust-src
      - run: cargo check -Z build-std=std,panic_abort --package fs2-turbo --target "${{ matrix.target }}" --lib --locked

  coverage:
    needs: support-matrix
    timeout-minutes: 20
    name: Coverage / ${{ matrix.target }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      COVERAGE_TOOLCHAIN: ${{ matrix.toolchain }}
      COVERAGE_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: "0"
      CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-combined-${{ matrix.target }}
      FS2_COVERAGE_REQUIRE_NATIVE_FIXTURES: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, toolchain: "1.98.1" }
          - { os: macos-latest, target: aarch64-apple-darwin, toolchain: "1.98.1" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, toolchain: "1.98.1" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Record exact native coverage provenance
        shell: bash
        run: bash .github/scripts/coverage-provenance.sh record "coverage-${{ matrix.target }}"
      - run: cargo llvm-cov --package fs2-turbo --lib --tests --target "${{ matrix.target }}" --locked --remap-path-prefix --lcov --output-path "coverage-${{ matrix.target }}.lcov" -- --test-threads=1
      - name: Export detailed coverage JSON
        run: cargo llvm-cov report --package fs2-turbo --target "${{ matrix.target }}" --locked --remap-path-prefix --json --output-path "coverage-${{ matrix.target }}.json"
      - name: Export coverage instantiations
        run: cargo llvm-cov report --package fs2-turbo --target "${{ matrix.target }}" --locked --remap-path-prefix --text --show-instantiations --output-path "coverage-${{ matrix.target }}.txt"
      - name: Export region-aware Codecov pilot without publishing it
        run: cargo llvm-cov report --package fs2-turbo --target "${{ matrix.target }}" --locked --remap-path-prefix --codecov --output-path "coverage-${{ matrix.target }}-codecov.json"
      - name: Measure unit-only instantiation diagnostics
        env:
          CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-unit-${{ matrix.target }}
        run: cargo llvm-cov --package fs2-turbo --lib --target "${{ matrix.target }}" --locked --remap-path-prefix --json --output-path "coverage-unit-${{ matrix.target }}.json" -- --test-threads=1
      - name: Export unit-only coverage instantiations
        env:
          CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-unit-${{ matrix.target }}
        run: cargo llvm-cov report --package fs2-turbo --target "${{ matrix.target }}" --locked --remap-path-prefix --text --show-instantiations --output-path "coverage-unit-${{ matrix.target }}.txt"
      - name: Measure integration-only instantiation diagnostics
        env:
          CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-integration-${{ matrix.target }}
        run: cargo llvm-cov --package fs2-turbo --test integration --target "${{ matrix.target }}" --locked --remap-path-prefix --json --output-path "coverage-integration-${{ matrix.target }}.json" -- --test-threads=1
      - name: Export integration-only coverage instantiations
        env:
          CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-integration-${{ matrix.target }}
        run: cargo llvm-cov report --package fs2-turbo --target "${{ matrix.target }}" --locked --remap-path-prefix --text --show-instantiations --output-path "coverage-integration-${{ matrix.target }}.txt"
      - name: Enforce native coverage policy
        run: >-
          cargo xtask coverage
          --target "${{ matrix.target }}"
          --json "coverage-${{ matrix.target }}.json"
          --lcov "coverage-${{ matrix.target }}.lcov"
          --unit-json "coverage-unit-${{ matrix.target }}.json"
          --integration-json "coverage-integration-${{ matrix.target }}.json"
          --diagnostics-json "coverage-diagnostics-${{ matrix.target }}.json"
      - name: Verify source identity after measurement
        if: always()
        shell: bash
        run: bash .github/scripts/coverage-provenance.sh verify "coverage-${{ matrix.target }}"
      - name: Test coverage collector on this native OS
        run: node --test .github/scripts/coverage-audit.test.cjs
      - name: Seal complete primary evidence
        run: node .github/scripts/coverage-audit.cjs seal primary "${{ matrix.target }}"
      - name: Retain coverage evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: |
            coverage-${{ matrix.target }}.lcov
            coverage-${{ matrix.target }}.json
            coverage-${{ matrix.target }}.txt
            coverage-unit-${{ matrix.target }}.json
            coverage-unit-${{ matrix.target }}.txt
            coverage-integration-${{ matrix.target }}.json
            coverage-integration-${{ matrix.target }}.txt
            coverage-diagnostics-${{ matrix.target }}.json
            coverage-${{ matrix.target }}-provenance.txt
            coverage-${{ matrix.target }}-source.sha256
            coverage-${{ matrix.target }}-codecov.json
            coverage-${{ matrix.target }}-receipt.json
          if-no-files-found: error
          retention-days: 14


  coverage_complete:
    name: Complete primary coverage evidence
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COVERAGE_JOB_RESULT: ${{ needs.coverage.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-x86_64-unknown-linux-gnu-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-x86_64-pc-windows-msvc-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-x86_64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-aarch64-apple-darwin-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-aarch64-apple-darwin
      - name: Validate coverage evidence
        if: ${{ !cancelled() }}
        id: audit
        run: node .github/scripts/coverage-audit.cjs collect primary target/coverage-inputs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.audit.outputs.report_directory != '' }}
        with:
          name: primary-coverage-summary-attempt-${{ github.run_attempt }}
          path: ${{ steps.audit.outputs.report_directory }}
          if-no-files-found: error
          retention-days: 14


  codecov_validation:
    name: Validate dev-coverage Codecov ingestion
    needs: [coverage, coverage_complete]
    if: github.event_name == 'workflow_dispatch' && github.repository == 'arthurianresolve/fs2-turbo' && github.ref == 'refs/heads/dev-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_JOB_RESULT: ${{ needs.coverage.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the existing Codecov upload secret
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: node -e 'if (!process.env.CODECOV_TOKEN) { throw new Error("Missing CODECOV_TOKEN"); }'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-x86_64-unknown-linux-gnu-attempt-${{ github.run_attempt }}
          path: coverage/coverage-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-x86_64-pc-windows-msvc-attempt-${{ github.run_attempt }}
          path: coverage/coverage-x86_64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-aarch64-apple-darwin-attempt-${{ github.run_attempt }}
          path: coverage/coverage-aarch64-apple-darwin
      - name: Recheck validation uploads against their exact source and attempt
        if: ${{ !cancelled() }}
        id: audit
        run: node .github/scripts/coverage-audit.cjs collect primary coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.audit.outputs.report_directory != '' }}
        with:
          name: codecov-validation-summary-attempt-${{ github.run_attempt }}
          path: ${{ steps.audit.outputs.report_directory }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation-only linux line coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1
          files: coverage/coverage-x86_64-unknown-linux-gnu/coverage-x86_64-unknown-linux-gnu.lcov
          disable_search: true
          disable_safe_directory: true
          plugins: noop
          fail_ci_if_error: true
          override_branch: dev-coverage
          override_commit: ${{ github.sha }}
          flags: validation-linux
          name: dev-coverage-linux-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload validation-only windows line coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1
          files: coverage/coverage-x86_64-pc-windows-msvc/coverage-x86_64-pc-windows-msvc.lcov
          disable_search: true
          disable_safe_directory: true
          plugins: noop
          fail_ci_if_error: true
          override_branch: dev-coverage
          override_commit: ${{ github.sha }}
          flags: validation-windows
          name: dev-coverage-windows-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload validation-only macos line coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1
          files: coverage/coverage-aarch64-apple-darwin/coverage-aarch64-apple-darwin.lcov
          disable_search: true
          disable_safe_directory: true
          plugins: noop
          fail_ci_if_error: true
          override_branch: dev-coverage
          override_commit: ${{ github.sha }}
          flags: validation-macos
          name: dev-coverage-macos-${{ github.run_id }}-${{ github.run_attempt }}

  coverage_tooling:
    name: Tooling coverage / ${{ matrix.target }}
    needs: support-matrix
    if: github.ref == 'refs/heads/dev-coverage' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      COVERAGE_TOOLCHAIN: "1.98.1"
      COVERAGE_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: "0"
      CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-tooling-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Record tooling provenance
        shell: bash
        run: bash .github/scripts/coverage-provenance.sh record "coverage-tooling-${{ matrix.target }}"
      - name: Measure tooling native coverage separately
        run: cargo llvm-cov --package fs2-dev --target "${{ matrix.target }}" --locked --remap-path-prefix --lcov --output-path "coverage-tooling-${{ matrix.target }}.lcov" -- --test-threads=1
      - run: cargo llvm-cov report --package fs2-dev --target "${{ matrix.target }}" --locked --remap-path-prefix --json --output-path "coverage-tooling-${{ matrix.target }}.json"
      - run: cargo llvm-cov report --package fs2-dev --target "${{ matrix.target }}" --locked --remap-path-prefix --text --show-instantiations --output-path "coverage-tooling-${{ matrix.target }}.txt"
      - name: Verify tooling source identity
        if: always()
        shell: bash
        run: bash .github/scripts/coverage-provenance.sh verify "coverage-tooling-${{ matrix.target }}"
      - name: Seal tooling evidence
        run: node .github/scripts/coverage-audit.cjs seal tooling "${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-tooling-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: coverage-tooling-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 14

  tooling_coverage_complete:
    name: Complete tooling coverage evidence
    needs: coverage_tooling
    if: always() && needs.coverage_tooling.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COVERAGE_JOB_RESULT: ${{ needs.coverage_tooling.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-tooling-x86_64-unknown-linux-gnu-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-tooling-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-tooling-x86_64-pc-windows-msvc-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-tooling-x86_64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-tooling-aarch64-apple-darwin-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-tooling-aarch64-apple-darwin
      - name: Validate coverage evidence
        if: ${{ !cancelled() }}
        id: audit
        run: node .github/scripts/coverage-audit.cjs collect tooling target/coverage-inputs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.audit.outputs.report_directory != '' }}
        with:
          name: tooling-coverage-summary-attempt-${{ github.run_attempt }}
          path: ${{ steps.audit.outputs.report_directory }}
          if-no-files-found: error
          retention-days: 14

  coverage_extended:
    name: Supplemental coverage / ${{ matrix.target }}
    needs: support-matrix
    if: github.ref == 'refs/heads/dev-coverage' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      COVERAGE_TOOLCHAIN: "1.98.1"
      COVERAGE_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: "0"
      CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-extended-${{ matrix.target }}
      FS2_COVERAGE_REQUIRE_NATIVE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Record extended provenance
        shell: bash
        run: bash .github/scripts/coverage-provenance.sh record "coverage-extended-${{ matrix.target }}"
      - name: Measure extended native coverage separately
        run: cargo llvm-cov --package fs2-turbo --lib --tests --target "${{ matrix.target }}" --locked --remap-path-prefix --lcov --output-path "coverage-extended-${{ matrix.target }}.lcov" -- --test-threads=1
      - run: cargo llvm-cov report --package fs2-turbo --target "${{ matrix.target }}" --locked --remap-path-prefix --json --output-path "coverage-extended-${{ matrix.target }}.json"
      - run: cargo llvm-cov report --package fs2-turbo --target "${{ matrix.target }}" --locked --remap-path-prefix --text --show-instantiations --output-path "coverage-extended-${{ matrix.target }}.txt"
      - run: cargo llvm-cov report --package fs2-turbo --target "${{ matrix.target }}" --locked --remap-path-prefix --codecov --output-path "coverage-extended-${{ matrix.target }}-codecov.json"
      - name: Verify extended source identity
        if: always()
        shell: bash
        run: bash .github/scripts/coverage-provenance.sh verify "coverage-extended-${{ matrix.target }}"
      - name: Seal extended evidence
        run: node .github/scripts/coverage-audit.cjs seal extended "${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-extended-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: coverage-extended-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 14

  extended_coverage_complete:
    name: Complete supplemental coverage evidence
    needs: coverage_extended
    if: always() && needs.coverage_extended.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COVERAGE_JOB_RESULT: ${{ needs.coverage_extended.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-extended-x86_64-apple-darwin-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-extended-x86_64-apple-darwin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-extended-aarch64-unknown-linux-gnu-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-extended-aarch64-unknown-linux-gnu
      - name: Validate coverage evidence
        if: ${{ !cancelled() }}
        id: audit
        run: node .github/scripts/coverage-audit.cjs collect extended target/coverage-inputs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.audit.outputs.report_directory != '' }}
        with:
          name: supplemental-coverage-summary-attempt-${{ github.run_attempt }}
          path: ${{ steps.audit.outputs.report_directory }}
          if-no-files-found: error
          retention-days: 14

  codecov:
    name: Publish release coverage
    needs: [coverage, coverage_complete]
    if: >-
      github.repository == 'arthurianresolve/fs2-turbo' &&
      github.ref == 'refs/heads/1.0.0' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-x86_64-unknown-linux-gnu-attempt-${{ github.run_attempt }}
          path: coverage/coverage-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-x86_64-pc-windows-msvc-attempt-${{ github.run_attempt }}
          path: coverage/coverage-x86_64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-aarch64-apple-darwin-attempt-${{ github.run_attempt }}
          path: coverage/coverage-aarch64-apple-darwin
      - name: Recheck the exact artifacts selected for publication
        if: ${{ !cancelled() }}
        id: publication_audit
        env:
          COVERAGE_JOB_RESULT: ${{ needs.coverage.result }}
        run: node .github/scripts/coverage-audit.cjs collect primary coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.publication_audit.outputs.report_directory != '' }}
        with:
          name: publication-coverage-summary-attempt-${{ github.run_attempt }}
          path: ${{ steps.publication_audit.outputs.report_directory }}
          if-no-files-found: error
          retention-days: 14
      - name: Require authentication and all native coverage reports
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -z "$CODECOV_TOKEN" ]]; then
            echo "::error::The CODECOV_TOKEN repository secret is required."
            exit 1
          fi
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            report="coverage/coverage-$target/coverage-$target.lcov"
            if [[ ! -s "$report" ]] || ! grep -q '^SF:' "$report" || ! grep -q '^DA:' "$report"; then
              echo "::error::Missing, empty, or incomplete coverage report: $report"
              exit 1
            fi
          done
      - name: Upload primary Linux line coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1
          files: coverage/coverage-x86_64-unknown-linux-gnu/coverage-x86_64-unknown-linux-gnu.lcov
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
          flags: primary-linux
          name: release-1.0.0-linux

      - name: Upload primary Windows line coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1
          files: coverage/coverage-x86_64-pc-windows-msvc/coverage-x86_64-pc-windows-msvc.lcov
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
          flags: primary-windows
          name: release-1.0.0-windows
      - name: Upload primary macOS line coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1
          files: coverage/coverage-aarch64-apple-darwin/coverage-aarch64-apple-darwin.lcov
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
          flags: primary-macos
          name: release-1.0.0-macos

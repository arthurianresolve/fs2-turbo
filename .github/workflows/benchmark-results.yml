name: Publish accepted runner benchmarks

"on":
  workflow_run:
    workflows: ["Windows benchmark pilot"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == github.event.repository.default_branch) && 'accepted-runner-benchmark-pages' || format('ignored-benchmark-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  render:
    permissions:
      contents: read
      actions: read
    if: >-
      github.repository == 'arthurianresolve/fs2-turbo' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'dev' ||
       github.event.workflow_run.head_branch == github.event.repository.default_branch) &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.render.outputs.ready }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out trusted renderer, never artifact-supplied code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          persist-credentials: false
      - name: Reject superseded branch heads
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SUBJECT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ./tools/ci/publish-benchmark-results.ps1 -Phase Check
      - name: Download only this run attempt's evidence
        if: steps.current.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-pilot-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/benchmark-evidence
          repository: arthurianresolve/fs2-turbo
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Restore both branches' last accepted results
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/ci/publish-benchmark-results.ps1 -Phase Restore
      - name: Render accepted reports with the repository Rust implementation
        id: render
        if: steps.current.outputs.current == 'true'
        env:
          SUBJECT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SUBJECT_SHA: ${{ github.event.workflow_run.head_sha }}
          SUBJECT_RUN_ID: ${{ github.event.workflow_run.id }}
          SUBJECT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
        run: |
          ./tools/ci/publish-benchmark-results.ps1 -Phase Render
      - name: Upload static accepted-results site
        if: steps.render.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/benchmark-site

  deploy:
    needs: render
    if: needs.render.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy accepted results
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

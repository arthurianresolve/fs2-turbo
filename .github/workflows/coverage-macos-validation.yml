name: Temporary macOS coverage validation

on:
  push:
    branches:
      - codex/coverage-macos-20260915-9a328249

permissions:
  contents: read

concurrency:
  group: temporary-macos-coverage-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  native-macos:
    if: github.repository == 'arthurianresolve/fs2-turbo' && github.ref == 'refs/heads/codex/coverage-macos-20260915-9a328249'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/macos-coverage-build
      CARGO_LLVM_COV_TARGET_DIR: target/macos-coverage-instrumented
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Record native host and source identity
        run: |
          set -euo pipefail
          umask 077
          mkdir -p target/macos-coverage-evidence
          uname -m > target/macos-coverage-evidence/architecture.txt
          grep -Fx arm64 target/macos-coverage-evidence/architecture.txt
          git rev-parse HEAD > target/macos-coverage-evidence/candidate-sha.txt
          grep -Fx "$GITHUB_SHA" target/macos-coverage-evidence/candidate-sha.txt
          git diff --exit-code
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > target/macos-coverage-evidence/run-identity.txt
          git ls-files -z | xargs -0 shasum -a 256 > target/macos-coverage-evidence/tracked-files.sha256
          sw_vers > target/macos-coverage-evidence/macos-version.txt
          uname -a > target/macos-coverage-evidence/native-host.txt
          df -k "$RUNNER_TEMP" > target/macos-coverage-evidence/disk-headroom.txt

      - name: Install exact compilers
        run: |
          set -euo pipefail
          unset RUSTUP_DIST_SERVER RUSTUP_UPDATE_ROOT
          rustup toolchain install 1.88.0 --profile minimal --component llvm-tools-preview
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustc +1.88.0 -vV > target/macos-coverage-evidence/rustc-1.88.0.txt
          rustc +1.98.1 -vV > target/macos-coverage-evidence/rustc-1.98.1.txt

      - name: Install the pinned prebuilt coverage tool
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      - name: Record coverage tool identity
        run: cargo +1.98.1 llvm-cov --locked --version

      - name: Test exact MSRV
        run: |
          set -euo pipefail
          cargo +1.88.0 test --package fs2-turbo --target aarch64-apple-darwin --locked -- --test-threads=1

      - name: Test primary compiler
        run: |
          set -euo pipefail
          cargo +1.98.1 test --package fs2-turbo --target aarch64-apple-darwin --locked -- --test-threads=1

      - name: Check formatting without rewriting source
        run: |
          set -euo pipefail
          cargo +1.98.1 fmt --all -- --check

      - name: Run strict Clippy
        run: |
          set -euo pipefail
          cargo +1.98.1 clippy --workspace --all-targets --target aarch64-apple-darwin --locked -- -D warnings

      - name: Validate documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo +1.98.1 doc --package fs2-turbo --no-deps --target aarch64-apple-darwin --locked --offline

      - name: Verify the package
        run: |
          set -euo pipefail
          cargo +1.98.1 package --package fs2-turbo --locked --offline

      - name: Measure exact MSRV diagnostic coverage
        env:
          CARGO_LLVM_COV_TARGET_DIR: target/macos-coverage-instrumented-1.88.0
        run: |
          set -euo pipefail
          cargo +1.88.0 llvm-cov --package fs2-turbo --lib --tests --target aarch64-apple-darwin --locked --offline --remap-path-prefix --lcov --output-path target/macos-coverage-evidence/coverage-1.88.0-aarch64-apple-darwin.lcov -- --test-threads=1
          cargo +1.88.0 llvm-cov report --package fs2-turbo --target aarch64-apple-darwin --locked --offline --remap-path-prefix --json --output-path target/macos-coverage-evidence/coverage-1.88.0-aarch64-apple-darwin.json
          cargo +1.88.0 llvm-cov report --package fs2-turbo --target aarch64-apple-darwin --locked --offline --remap-path-prefix --text --show-instantiations --output-path target/macos-coverage-evidence/coverage-1.88.0-aarch64-apple-darwin.txt

      - name: Measure primary Rust coverage
        env:
          CARGO_LLVM_COV_TARGET_DIR: target/macos-coverage-instrumented-1.98.1
        run: |
          set -euo pipefail
          cargo +1.98.1 llvm-cov --package fs2-turbo --lib --tests --target aarch64-apple-darwin --locked --offline --remap-path-prefix --lcov --output-path target/macos-coverage-evidence/coverage-1.98.1-aarch64-apple-darwin.lcov -- --test-threads=1
          cargo +1.98.1 llvm-cov report --package fs2-turbo --target aarch64-apple-darwin --locked --offline --remap-path-prefix --json --output-path target/macos-coverage-evidence/coverage-1.98.1-aarch64-apple-darwin.json
          cargo +1.98.1 llvm-cov report --package fs2-turbo --target aarch64-apple-darwin --locked --offline --remap-path-prefix --text --show-instantiations --output-path target/macos-coverage-evidence/coverage-1.98.1-aarch64-apple-darwin.txt

      - name: Measure primary unit-only instantiation diagnostics
        env:
          CARGO_LLVM_COV_TARGET_DIR: target/macos-coverage-unit-1.98.1
        run: |
          set -euo pipefail
          cargo +1.98.1 llvm-cov --package fs2-turbo --lib --target aarch64-apple-darwin --locked --offline --remap-path-prefix --json --output-path target/macos-coverage-evidence/coverage-unit-1.98.1-aarch64-apple-darwin.json -- --test-threads=1
          cargo +1.98.1 llvm-cov report --package fs2-turbo --target aarch64-apple-darwin --locked --offline --remap-path-prefix --text --show-instantiations --output-path target/macos-coverage-evidence/coverage-unit-1.98.1-aarch64-apple-darwin.txt

      - name: Measure primary integration-only instantiation diagnostics
        env:
          CARGO_LLVM_COV_TARGET_DIR: target/macos-coverage-integration-1.98.1
        run: |
          set -euo pipefail
          cargo +1.98.1 llvm-cov --package fs2-turbo --test integration --target aarch64-apple-darwin --locked --offline --remap-path-prefix --json --output-path target/macos-coverage-evidence/coverage-integration-1.98.1-aarch64-apple-darwin.json -- --test-threads=1
          cargo +1.98.1 llvm-cov report --package fs2-turbo --target aarch64-apple-darwin --locked --offline --remap-path-prefix --text --show-instantiations --output-path target/macos-coverage-evidence/coverage-integration-1.98.1-aarch64-apple-darwin.txt

      - name: Enforce primary coverage policy
        run: >-
          cargo +1.98.1 xtask coverage
          --target aarch64-apple-darwin
          --json target/macos-coverage-evidence/coverage-1.98.1-aarch64-apple-darwin.json
          --lcov target/macos-coverage-evidence/coverage-1.98.1-aarch64-apple-darwin.lcov
          --unit-json target/macos-coverage-evidence/coverage-unit-1.98.1-aarch64-apple-darwin.json
          --integration-json target/macos-coverage-evidence/coverage-integration-1.98.1-aarch64-apple-darwin.json
          --diagnostics-json target/macos-coverage-evidence/coverage-diagnostics-1.98.1-aarch64-apple-darwin.json

      - name: Confirm measurements did not change tracked source
        run: |
          set -euo pipefail
          git diff --exit-code
          shasum -a 256 -c target/macos-coverage-evidence/tracked-files.sha256

      - name: Retain evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: target/macos-coverage-evidence
          if-no-files-found: error
          retention-days: 7

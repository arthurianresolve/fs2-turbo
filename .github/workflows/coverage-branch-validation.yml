name: Nightly branch coverage gate

"on":
  push:
    branches: [dev-coverage, dev, "1.0.0"]
  pull_request:
    branches: [dev-coverage, dev, "1.0.0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch_coverage:
    name: Branch baseline / ${{ matrix.target }}
    if: >-
      github.repository == 'arthurianresolve/fs2-turbo' &&
      (github.event_name == 'pull_request' || github.ref_type == 'branch') &&
      contains(fromJSON('["dev-coverage","dev","1.0.0"]'), github.base_ref || github.ref_name)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-14
      COVERAGE_TOOLCHAIN: "1.99.0-nightly"
      COVERAGE_TARGET: ${{ matrix.target }}
      COVERAGE_RUNNER_LABEL: ${{ matrix.os }}
      CARGO_INCREMENTAL: "0"
      CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-branch-${{ matrix.target }}
      FS2_COVERAGE_REQUIRE_NATIVE_FIXTURES: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025-vs2026, target: x86_64-pc-windows-msvc }
          - { os: macos-26, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-14
          components: llvm-tools-preview
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Test evidence integrity and relocation proposals
        run: node --test .github/scripts/coverage-audit.test.cjs .github/scripts/coverage-relocate.test.cjs
      - name: Bind the diagnostic compiler and exact source
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV | tr -d '\r' | grep -Fx 'commit-hash: ba28ff76f353a722f31c4f3dd2ac4e437d36411b'
          rustc -vV | tr -d '\r' | grep -Fx 'LLVM version: 23.1.0'
          bash .github/scripts/coverage-provenance.sh record "coverage-branch-${COVERAGE_TARGET}"
      - name: Measure native library branch outcomes
        run: >-
          cargo llvm-cov --branch --package fs2-turbo --lib --tests
          --target "${{ matrix.target }}" --locked --remap-path-prefix
          --json --output-path "coverage-branch-${{ matrix.target }}.json"
          -- --test-threads=1
      - name: Export raw LCOV branch records without uploading to Codecov
        run: >-
          cargo llvm-cov report --branch --package fs2-turbo
          --target "${{ matrix.target }}" --locked --remap-path-prefix
          --lcov --output-path "coverage-branch-${{ matrix.target }}.lcov"
      - name: Export branch and instantiation detail
        env:
          LLVM_COV_FLAGS: --show-branches=count
        run: >-
          cargo llvm-cov report --branch --package fs2-turbo
          --target "${{ matrix.target }}" --locked --remap-path-prefix
          --text --show-instantiations --output-path "coverage-branch-${{ matrix.target }}.txt"
      - name: Enforce complete reviewed branch coverage
        shell: bash
        run: |
          node .github/scripts/coverage-branch-summary.cjs
      - name: Verify source identity after measurement
        if: always()
        shell: bash
        run: bash .github/scripts/coverage-provenance.sh verify "coverage-branch-${COVERAGE_TARGET}"
      - name: Seal complete native branch evidence
        run: node .github/scripts/coverage-audit.cjs seal branch "${{ matrix.target }}"
      - name: Retain branch evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-coverage-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: |
            coverage-branch-${{ matrix.target }}.json
            coverage-branch-${{ matrix.target }}.lcov
            coverage-branch-${{ matrix.target }}.txt
            coverage-branch-${{ matrix.target }}-provenance.txt
            coverage-branch-${{ matrix.target }}-source.sha256
            coverage-branch-${{ matrix.target }}-receipt.json
          if-no-files-found: error
          retention-days: 14

  complete-branch-evidence:
    name: Complete nightly branch evidence
    needs: branch_coverage
    if: >-
      always() &&
      github.repository == 'arthurianresolve/fs2-turbo' &&
      (github.event_name == 'pull_request' || github.ref_type == 'branch') &&
      contains(fromJSON('["dev-coverage","dev","1.0.0"]'), github.base_ref || github.ref_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COVERAGE_JOB_RESULT: ${{ needs.branch_coverage.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: branch-coverage-x86_64-unknown-linux-gnu-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-branch-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: branch-coverage-x86_64-pc-windows-msvc-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-branch-x86_64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: branch-coverage-aarch64-apple-darwin-attempt-${{ github.run_attempt }}
          path: target/coverage-inputs/coverage-branch-aarch64-apple-darwin
      - name: Require all exact-SHA native branch evidence
        id: audit
        if: ${{ !cancelled() }}
        run: node .github/scripts/coverage-audit.cjs collect branch target/coverage-inputs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.audit.outputs.report_directory != '' }}
        with:
          name: branch-coverage-summary-attempt-${{ github.run_attempt }}
          path: ${{ steps.audit.outputs.report_directory }}
          if-no-files-found: error
          retention-days: 14
